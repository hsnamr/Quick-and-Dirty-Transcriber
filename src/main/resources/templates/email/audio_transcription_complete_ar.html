<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اكتملت الترجمة الصوتية</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; direction: rtl;">
  <h2 style="color: #16a34a;">اكتملت الترجمة الصوتية</h2>
  <p>مرحباً <span th:text="${userName}">المستخدم</span>،</p>
  <p>تم إكمال الترجمة الصوتية بنجاح.</p>
  <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>الملف</strong></td><td style="padding: 8px; border: 1px solid #ddd;" th:text="${fileName}">-</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>المدة</strong></td><td style="padding: 8px; border: 1px solid #ddd;" th:text="${durationFormatted}">-</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>الفئة</strong></td><td style="padding: 8px; border: 1px solid #ddd;" th:text="${category}">-</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>اللغة</strong></td><td style="padding: 8px; border: 1px solid #ddd;" th:text="${languageName}">-</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>الحالة</strong></td><td style="padding: 8px; border: 1px solid #ddd;">مكتمل</td></tr>
    <tr><td style="padding: 8px; border: 1px solid #ddd;"><strong>وقت الاكتمال</strong></td><td style="padding: 8px; border: 1px solid #ddd;" th:text="${createdAtFormatted}">-</td></tr>
  </table>
  <p>يمكنك الآن عرض نتائج الترجمة.</p>
  <p style="margin-top: 30px; color: #666; font-size: 0.9em;">— Free and Dirty Transcriber</p>
</body>
</html>
